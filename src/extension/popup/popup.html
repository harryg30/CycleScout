<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CycleScout</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <h1>CycleScout</h1>
      <p class="tagline">Street-level preview for cycling routes</p>
    </header>

    <section class="controls" aria-label="Feature controls">
      <fieldset class="row map-click-button">
        <legend>Set Anchor with</legend>
        <div class="segmented" role="radiogroup" aria-label="Map Click Button">
          <label>
            <input type="radio" name="map-click-button" value="left" id="map-click-left" />
            Left click
          </label>
          <label>
            <input type="radio" name="map-click-button" value="right" id="map-click-right" checked />
            Right click
          </label>
          <label>
            <input type="radio" name="map-click-button" value="middle" id="map-click-middle" />
            Scroll wheel
          </label>
        </div>
      </fieldset>
      <p class="hint">
        Left click still draws the route. Choose which button moves the Pano.
      </p>
    </section>

    <section class="maps-key" aria-label="Maps Key">
      <label class="maps-key-label" for="maps-key">Maps Key</label>
      <input
        id="maps-key"
        type="password"
        autocomplete="off"
        spellcheck="false"
        placeholder="Paste your Maps Key"
      />
      <p class="hint">
        Create a Maps Key in your Google Cloud project, then paste it here.
        <a
          href="https://github.com/harryg30/CycleScout/blob/main/docs/maps-key.md"
          target="_blank"
          rel="noopener noreferrer"
        >How to set up a Maps Key</a>
      </p>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
